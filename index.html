<style>
:root {
  --bg: #08090a;
  --panel: #131619;
  --panel-2: #171b1e;
  --line: #2d3336;
  --line-soft: #22282b;
  --text: #d8dcda;
  --dim: #8d9793;
  --accent: #3aa76d;       /* Isle of Man Green — UI-legible tint */
  --accent-deep: #1a5c3a;  /* Isle of Man Green — deep */
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--accent); }

/* ---------- 3D stage ---------- */
#stage {
  position: fixed; inset: 0;
  opacity: 0; transition: opacity 1.1s ease;
}
#stage.ready { opacity: 1; }
#stage canvas { display: block; }

/* ---------- loader ---------- */
#loader {
  position: fixed; left: 50%; bottom: 18vh; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  color: var(--dim); text-transform: uppercase;
  transition: opacity 0.6s ease;
}
#loader.done { opacity: 0; pointer-events: none; }

/* ---------- header (name + tagline now live in the 3D backdrop dome) ----------
#header {
  position: fixed; top: max(20px, env(safe-area-inset-top)); left: 26px; z-index: 5;
  pointer-events: none;
}
#header h1 {
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--text);
}
#header p {
  margin-top: 5px; font-size: 12px; letter-spacing: 0.06em; color: var(--dim);
}
#header .rule {
  width: 44px; height: 1px; background: var(--accent); margin-top: 9px; opacity: 0.9;
}
---------- end disabled header ---------- */

/* ---------- corner external links ---------- */
#ext-links {
  position: fixed; top: max(18px, env(safe-area-inset-top)); right: 20px; z-index: 5;
  display: flex; gap: 6px;
}
#ext-links a {
  display: grid; place-items: center; width: 34px; height: 34px;
  border: 1px solid var(--line); border-radius: 6px;
  color: var(--dim); background: rgba(10, 12, 13, 0.55);
  transition: color 0.2s, border-color 0.2s, transform 0.2s;
}
#ext-links a:hover, #ext-links a:focus-visible { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
#ext-links svg { width: 15px; height: 15px; }

/* ---------- interaction hint ---------- */
#hint, #hint-parts {
  position: fixed; left: 50%; bottom: max(34px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 5; pointer-events: none; text-align: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--dim);
  opacity: 0; transition: opacity 0.8s ease;
}
#hint-parts { bottom: max(64px, env(safe-area-inset-bottom)); }
#hint.show, #hint-parts.show { opacity: 1; animation: hint-pulse 2.6s ease-in-out infinite; }
#hint.gone, #hint-parts.gone { opacity: 0 !important; animation: none; }
#hint .tick { display: block; width: 1px; height: 22px; margin: 0 auto 10px; background: linear-gradient(to bottom, transparent, var(--accent)); }
@keyframes hint-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

/* ---------- reassemble toggle ---------- */
#btn-assemble {
  position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 5;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--dim); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 18px; background: rgba(10, 12, 13, 0.6);
  transition: color 0.2s, border-color 0.2s, opacity 0.4s;
}
#btn-assemble:hover, #btn-assemble:focus-visible { color: var(--accent); border-color: var(--accent); }
#btn-assemble[hidden] { display: none; }

/* ---------- floating part labels ---------- */
#labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.part-label {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -130%);
  pointer-events: auto; white-space: nowrap; text-align: center;
  font-family: var(--mono); text-transform: uppercase;
  padding: 7px 12px 6px;
  border: 1px solid var(--line); border-radius: 4px;
  background: rgba(9, 11, 12, 0.72); backdrop-filter: blur(3px);
  color: var(--dim); opacity: 0; transition: opacity 0.45s ease, color 0.2s, border-color 0.2s;
}
.part-label .pl-part { display: block; font-size: 8.5px; letter-spacing: 0.3em; opacity: 0.75; }
.part-label .pl-section { display: block; margin-top: 3px; font-size: 11.5px; letter-spacing: 0.18em; color: var(--text); }
.part-label.show { opacity: 0.72; }
.part-label.show.hot, .part-label.show:hover, .part-label.show:focus-visible {
  opacity: 1; color: var(--accent); border-color: var(--accent);
}
.part-label.show.hot .pl-section, .part-label.show:hover .pl-section, .part-label.show:focus-visible .pl-section { color: var(--accent); }
.part-label:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

/* ---------- backdrop + panel ---------- */
#backdrop {
  position: fixed; inset: 0; z-index: 8;
  background: rgba(4, 5, 6, 0.4);
  backdrop-filter: blur(7px) brightness(0.6);
  -webkit-backdrop-filter: blur(7px) brightness(0.6);
  opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
#backdrop.open { opacity: 1; pointer-events: auto; }

#panel {
  position: fixed; left: 50%; top: 50%; z-index: 9;
  transform: translate(-50%, calc(-50% + 26px)); opacity: 0; pointer-events: none;
  transition: transform 0.5s cubic-bezier(0.22, 1, 0.3, 1), opacity 0.35s ease;
  background:
    radial-gradient(circle at 1px 1px, rgba(160, 205, 180, 0.05) 1px, transparent 0) 0 0 / 26px 26px,
    linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: 10px;
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    0 0 60px rgba(46, 158, 99, 0.05),
    inset 0 1px 0 rgba(255, 255, 255, 0.04),
    inset 0 0 0 1px rgba(46, 158, 99, 0.04);
  display: flex; flex-direction: column; overflow: hidden;
}
#panel.open {
  transform: translate(-50%, -50%); opacity: 1; pointer-events: auto;
  box-shadow:
    0 30px 90px rgba(0, 0, 0, 0.62),
    0 0 90px rgba(46, 158, 99, 0.1),
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    inset 0 0 0 1px rgba(46, 158, 99, 0.06);
}
#panel.size-large { width: min(1180px, 88vw); height: min(86vh, 860px); }
#panel.size-small { width: min(620px, 92vw); max-height: 78vh; }

/* corner registration marks (technical-drawing viewfinder) */
.panel-frame { position: absolute; inset: 11px; z-index: 4; pointer-events: none; }
.panel-frame i {
  position: absolute; width: 15px; height: 15px;
  border: 1px solid rgba(46, 158, 99, 0.45);
  opacity: 0; transition: opacity 0.5s ease 0.2s;
}
#panel.open .panel-frame i { opacity: 1; }
.panel-frame i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.panel-frame i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.panel-frame i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.panel-frame i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

/* giant ghosted section number behind the header */
.panel-wm {
  position: absolute; top: -18px; right: 18px; z-index: 0; pointer-events: none;
  font-family: var(--mono); font-weight: 700; font-size: 190px; line-height: 1;
  letter-spacing: -0.05em; color: rgba(210, 235, 220, 0.028);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.3, 1);
}
#panel.open .panel-wm { opacity: 1; transform: none; }

.panel-head {
  position: relative; z-index: 2; flex: none;
  padding: 24px 30px 16px; border-bottom: 1px solid var(--line-soft);
}
.panel-head-row { display: flex; align-items: flex-start; justify-content: space-between; }
.panel-eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.32em;

.panel-title {

}
/* accent underline that draws in on open */
.panel-underline {
  height: 2px; width: 0; margin-top: 13px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent), rgba(46, 158, 99, 0));
}
#panel.open .panel-underline {
  width: 68px; transition: width 0.6s cubic-bezier(0.22, 1, 0.3, 1) 0.15s;
  box-shadow: 0 0 12px rgba(46, 158, 99, 0.5);
}
/* titleblock metadata strip */
.panel-titleblock {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em;

}
.panel-titleblock .tb-live { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }

  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);

}
@keyframes tb-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
#panel-close {
  flex: none; width: 38px; height: 38px; margin: -6px -8px 0 16px;

  transition: color 0.2s, border-color 0.2s;
}
#panel-close:hover, #panel-close:focus-visible { color: var(--accent); border-color: var(--accent); }

.panel-body { position: relative; z-index: 1; padding: 26px 30px 30px; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* staggered entrance for content items */
@keyframes panel-item-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.p-text { font-size: 15px; line-height: 1.75; color: var(--text); max-width: 62ch; }

.timeline { position: relative; }
.entry {

.entry-logo {

.proj-slot span { font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.22em; text-transform: uppercase; }
.proj-body { padding: 11px 14px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.proj-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.proj-title { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
.proj-date {
  flex: none; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
}
.proj-desc { font-size: 12.5px; line-height: 1.6; color: var(--dim); flex: 1; margin: 0; }
.proj-link {
  display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); text-decoration: none; transition: opacity 0.2s;
}
.proj-link svg { width: 14px; height: 14px; flex: none; }
a.proj-link:hover, a.proj-link:focus-visible { text-decoration: underline; }
.proj-link.is-empty { color: #5d6763; }

/* legacy card list (superseded by .proj-grid above) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; counter-reset: proj; }
.card {
  position: relative; counter-increment: proj; overflow: hidden;
  border: 1px solid var(--line-soft); border-radius: 8px; padding: 20px 20px 18px;
  background: rgba(255, 255, 255, 0.015);
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
}
.card::before { /* index tag */
  content: "P-" counter(proj, decimal-leading-zero);
  position: absolute; top: 14px; right: 15px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em; color: var(--dim); opacity: 0.65;
}
.card::after { /* top accent bar, grows on hover */
  content: ""; position: absolute; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(to right, var(--accent), rgba(46, 158, 99, 0));
  transition: width 0.4s cubic-bezier(0.22, 1, 0.3, 1);
}
.card:hover { border-color: rgba(46, 158, 99, 0.5); transform: translateY(-3px); box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4), 0 0 26px rgba(46, 158, 99, 0.12); }
.card:hover::after { width: 100%; }
.card h3 { font-size: 15px; font-weight: 600; padding-right: 44px; }
.card p { font-size: 13.5px; line-height: 1.65; color: var(--dim); flex: 1; }
.card a {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  text-decoration: none; color: var(--accent); align-self: flex-start;
}
.card a:hover, .card a:focus-visible { text-decoration: underline; }

/* Skills — categorised, colour-coded component boxes */
.skill-groups { display: flex; flex-direction: column; gap: 13px; }
.skill-group-title {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim);
  margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft);
}
.skill-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.skill-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 6px;
  border: 1px solid var(--c-bd); background: var(--c-bg);
  color: #eaf1ec; font-size: 13.5px; letter-spacing: 0.01em; white-space: nowrap;
  transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
}
.skill-chip:hover {
  transform: translateY(-2px); background: var(--c-bg-hi);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
}
.skill-ico { flex: none; width: 18px; height: 18px; color: var(--c); }
.skill-ico svg { width: 100%; height: 100%; display: block; }
.skill-name { line-height: 1; }

/* legacy flat chip list (unused once skills are grouped) */
.chips { display: flex; flex-wrap: wrap; gap: 10px; counter-reset: skill; }
.chip {
  position: relative; counter-increment: skill;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
  padding: 9px 15px; border: 1px solid var(--line); border-radius: 6px;
  color: var(--text); background: rgba(255, 255, 255, 0.015);
  transition: border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
}
.chip::before {
  content: counter(skill, decimal-leading-zero);
  margin-right: 9px; color: var(--accent); opacity: 0.7; font-size: 10px;
}
.chip:hover { border-color: var(--accent); color: #eafff2; background: rgba(46, 158, 99, 0.1); box-shadow: 0 0 18px rgba(46, 158, 99, 0.14); }

/* Contact — spec rows with arrow */
.spec-rows { display: flex; flex-direction: column; }
.spec-row {
  position: relative; display: flex; align-items: center; gap: 14px;
  padding: 15px 26px 15px 14px; border-bottom: 1px solid var(--line-soft);
  text-decoration: none; transition: background 0.2s, padding-left 0.2s;
}
.spec-row .ico { flex: none; width: 17px; height: 17px; color: var(--dim); transition: color 0.2s; }
.spec-row .ico svg { width: 100%; height: 100%; display: block; }
a.spec-row:hover .ico, a.spec-row:focus-visible .ico { color: var(--accent); }
.spec-row:first-child { border-top: 1px solid var(--line-soft); }
.spec-row::before { /* left accent tick */
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 2px; height: 0; background: var(--accent); transition: height 0.2s ease;
}
.spec-row .k {
  flex: none; width: 92px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim);
}
.spec-row .v { font-size: 14px; color: var(--text); word-break: break-word; }
a.spec-row::after {
  content: "\203A"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 18px; color: var(--accent); opacity: 0; transition: opacity 0.2s, right 0.2s;
}
a.spec-row:hover, a.spec-row:focus-visible { background: rgba(46, 158, 99, 0.06); padding-left: 20px; }
a.spec-row:hover .v, a.spec-row:focus-visible .v { color: var(--accent); }
a.spec-row:hover::before, a.spec-row:focus-visible::before { height: 60%; }
a.spec-row:hover::after, a.spec-row:focus-visible::after { opacity: 1; right: 8px; }

/* Education — titleblock plate */
.edu-plate {
  position: relative; padding: 18px 20px; border: 1px solid var(--line-soft); border-radius: 8px;
  background: rgba(255, 255, 255, 0.015); overflow: hidden;
}
.edu-plate::before {
  content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
  background: linear-gradient(to bottom, var(--accent), rgba(46, 158, 99, 0));
}
.edu-head { display: flex; gap: 18px; align-items: flex-start; }
/* the crest is a transparent PNG, so it needs a light tile behind it and
   `contain` so the circular seal isn't cropped */
.edu-logo {
  flex: none; width: 66px; height: 66px; margin-top: 2px; padding: 4px;
  border: 1px solid var(--line-soft); border-radius: 11px;
  background: #f6f7f6; overflow: hidden;
  transition: border-color 0.22s, box-shadow 0.22s;
}
.edu-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.edu-plate:hover .edu-logo {
  border-color: rgba(46, 158, 99, 0.55);
  box-shadow: 0 0 16px rgba(46, 158, 99, 0.14);
}
.edu-school { font-size: 19px; font-weight: 600; }
.edu-program { margin-top: 6px; font-size: 15px; color: var(--text); }
.edu-dates { margin-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.edu-details { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 14px; line-height: 1.75; color: var(--dim); }
/* GPA / awards / courses, as a spec-sheet readout */
.edu-rows {
  margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 11px;
}
.edu-row { display: flex; gap: 16px; align-items: baseline; }
.edu-row .k {
  flex: none; width: 74px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim);
}
.edu-row .v { font-size: 14px; color: var(--text); display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.edu-tag {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em;
  padding: 4px 10px; border: 1px solid var(--line-soft); border-radius: 5px;
  color: var(--text); background: rgba(255, 255, 255, 0.02);
  transition: border-color 0.2s, color 0.2s;
}
.edu-tag:hover { border-color: rgba(46, 158, 99, 0.5); color: var(--accent); }


/* ---------- a11y helpers ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- responsive ---------- */
@media (max-width: 700px) {
  #ext-links { right: 12px; }
  #panel.size-large { width: 94vw; height: 88vh; }
  #panel.size-small { width: 94vw; max-height: 82vh; }
  .panel-head { padding: 20px 20px 16px; }
  .panel-body { padding: 18px 20px 24px; }
  .part-label .pl-part { display: none; }
  .part-label { padding: 6px 10px; }
  .edu-row { flex-direction: column; gap: 8px; }
  .edu-row .k { width: auto; }
  .proj-grid { grid-template-columns: 1fr; gap: 13px; }
  .panel-wm { font-size: 118px; top: -10px; right: 12px; }
  .panel-head { padding: 20px 20px 14px; }
  .entry { padding-left: 24px; gap: 14px; padding-bottom: 24px; }
  .entry-logo { width: 48px; height: 48px; }
  .entry h3 { font-size: 17px; }
  .entry .meta { font-size: 11px; }
  .edu-logo { width: 50px; height: 50px; }
  .edu-head { gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  #hint.show { animation: none; opacity: 0.8; }
  #panel, #backdrop, #stage { transition-duration: 0.01s; }
  #panel.open .anim-item { animation: none; }
  .panel-titleblock .tb-dot { animation: none; }
  #panel.open .panel-underline { transition-duration: 0.01s; }
}
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   SECTION / PART DEFINITIONS
   ===================================================================== */
const ACCENT = 0x2e9e63;
const PAINT = 0x14562f; // Isle of Man Green body paint

const SECTIONS = {
  experience: { num: '01', part: 'Chassis',            title: 'Experience', size: 'large', groups: ['body', 'chassis'], labelGroup: 'body' },
  projects:   { num: '02', part: 'Engine',             title: 'Projects',   size: 'large', groups: ['engine'] },
  education:  { num: '03', part: 'Wheels · Suspension', title: 'Education', size: 'small', groups: ['wheels'] },
  about:      { num: '04', part: 'Cockpit',            title: 'About Me',   size: 'small', groups: ['cockpit'] },
  skills:     { num: '05', part: 'Instrument Cluster', title: 'Skills',     size: 'large', groups: ['dashboard'] },
  contact:    { num: '06', part: 'Key Fob',            title: 'Contact',    size: 'small', groups: ['keyfob'] },
};
const SECTION_ORDER = ['experience', 'projects', 'education', 'about', 'skills', 'contact'];

/* Explode offsets per group, in normalized car units (car length ≈ 4.3). */
const EXPLODE = {
  body:      new THREE.Vector3(0, 1.95, 0),
  chassis:   new THREE.Vector3(0, -0.68, 0),
  engine:    new THREE.Vector3(0, 0.85, 2.95),
  wheels:    new THREE.Vector3(0, -0.28, 0),
  cockpit:   new THREE.Vector3(0, 0.35, -2.75),
  dashboard: new THREE.Vector3(0, 1.40, 1.30),
  keyfob:    new THREE.Vector3(2.55, 1.65, 1.55),
};
const ROOT_RAISE = 1.0;       // whole assembly lifts while exploded
const WHEEL_SPREAD = 1.15;    // per-wheel lateral push

/* Mesh-name → group classification (checked in order; default = body). */
const CLASSIFY = [
  ['engine',    /^(engine|filters|radiator)/],
  ['wheels',    /^(tire-low|wheel-full|brake-disc|brake-caliper|damper)/],
  ['dashboard', /^(dashboard|steering-wheel)/],
  ['cockpit',   /^(seat-|interior-|plane)/],
  ['chassis',   /^(floor|exhaust-|cube|circle|wheel-arch)/],
];

const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;

/* =====================================================================
   RENDERER / SCENE / CAMERA
   ===================================================================== */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050607);
scene.fog = new THREE.FogExp2(0x050607, 0.038);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.layers.enable(1);
const START_DIST = isTouch || innerWidth < 700 ? 12.5 : 7.6;
camera.position.set(5.2, 2.6, 7.4).normalize().multiplyScalar(START_DIST + 4);
camera.position.y += 1.6;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 14;   // keep inside DOME_RADIUS (16)
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotate = !prefersReduced;
controls.autoRotateSpeed = 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* =====================================================================
   LIGHTING
   ===================================================================== */
const keyLight = new THREE.SpotLight(0xfff2dd, 320, 0, 0.62, 0.55, 1.6);
keyLight.position.set(4.5, 9.5, 4.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
keyLight.shadow.bias = -0.0004;
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 30;
scene.add(keyLight);
scene.add(keyLight.target);

const rimA = new THREE.DirectionalLight(0x9fd8b8, 2.4);
rimA.position.set(-6, 3.2, -6);
scene.add(rimA);
const rimB = new THREE.DirectionalLight(0xbcd0e0, 1.7);
rimB.position.set(6.5, 2.4, -5);
scene.add(rimB);
scene.add(new THREE.HemisphereLight(0x39433e, 0x0a0c0b, 1.4));

/* =====================================================================
   FLOOR: reflection + radial fade + engineering grid + backdrop glow
   ===================================================================== */
function radialCanvas(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  draw(c.getContext('2d'), 1024);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const reflector = new Reflector(new THREE.CircleGeometry(10, 64), {
  clipBias: 0.003,
  textureWidth: (isTouch ? 512 : 1024) * Math.min(devicePixelRatio, 2),
  textureHeight: (isTouch ? 512 : 1024) * Math.min(devicePixelRatio, 2),
  color: 0x9099a0,
});
reflector.rotation.x = -Math.PI / 2;
scene.add(reflector);

/* dark radial veil over the mirror so the reflection stays subtle */
const veilTex = radialCanvas((ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(5,7,8,0.80)');
  g.addColorStop(0.55, 'rgba(5,7,8,0.94)');
  g.addColorStop(1, 'rgba(5,6,7,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
});
const veil = new THREE.Mesh(
  new THREE.PlaneGeometry(34, 34),
  new THREE.MeshBasicMaterial({ map: veilTex, transparent: true, depthWrite: false })
);
veil.rotation.x = -Math.PI / 2;
veil.position.y = 0.005;
veil.renderOrder = 1;
scene.add(veil);

/* faint engineering grid, radially faded */
const gridTex = radialCanvas((ctx, s) => {
  ctx.strokeStyle = 'rgba(150,205,175,0.5)';
  ctx.lineWidth = 1;
  const step = s / 28;
  for (let i = 0; i <= 28; i++) {
    ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(s, i * step); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'destination-in';
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(0,0,0,0.16)');
  g.addColorStop(0.45, 'rgba(0,0,0,0.07)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
});
const grid = new THREE.Mesh(
  new THREE.PlaneGeometry(26, 26),
  new THREE.MeshBasicMaterial({ map: gridTex, transparent: true, depthWrite: false })
);
grid.rotation.x = -Math.PI / 2;
grid.position.y = 0.012;
grid.renderOrder = 2;
scene.add(grid);

/* contact shadows land on this invisible catcher */
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.position.y = 0.02;
shadowCatcher.receiveShadow = true;
shadowCatcher.renderOrder = 3;
scene.add(shadowCatcher);

/* studio glow behind the car (billboard, excluded from the mirror) */
const glowTex = radialCanvas((ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(150,230,185,0.34)');
  g.addColorStop(0.35, 'rgba(90,160,125,0.13)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
});
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, transparent: true, depthWrite: false, depthTest: false, opacity: 0.85,
}));
glow.scale.set(17, 9.5, 1);
glow.position.set(0, 1.5, 0);
glow.renderOrder = -1;
glow.layers.set(1); // main camera renders layer 1; the Reflector's camera does not
scene.add(glow);

/* =====================================================================
   BACKDROP DOME
   Four elements — name, portrait, title, crest — evenly spaced 90° apart on
   a ring around the car and tilted inward, so they read like the curved wall
   of a showroom. They sit in world space, so orbiting and zooming the car
   sweeps past them exactly as if they were painted on the dome.
   ===================================================================== */
const DOME_RADIUS = 16;          // must stay > controls.maxDistance (14) so the
                                 // camera can never orbit outside the dome
const DOME_Y = 3.2;              // height of the element centres
const domeGroup = new THREE.Group();
scene.add(domeGroup);

/* Azimuth of the element that sits directly behind the car on first load —
   derived from the intro camera direction so the name greets you head-on. */
const DOME_BASE_AZ = Math.atan2(-5.2, -7.4);

/* Display face, with a system fallback if the webfont doesn't load. */
const SG = `'Space Grotesk', 'Segoe UI', system-ui, Arial, sans-serif`;
const DOME_FONTS = { display: SG, technical: SG };

/* Text drawn to a canvas, with manual letter-spacing for the technical look. */
function makeTextTexture(text, { size = 200, weight = 800, family = DOME_FONTS.display, color = '#e6efe9', track = 0.04 } = {}) {
  const font = `${weight} ${size}px ${family}`;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = font;
  const chars = [...text];
  const sp = size * track;
  const textW = chars.reduce((a, ch) => a + probe.measureText(ch).width + sp, 0) - sp;
  const pad = size * 0.3;
  const c = document.createElement('canvas');
  c.width = Math.ceil(textW + pad * 2);
  c.height = Math.ceil(size * 1.4 + pad * 2);
  const ctx = c.getContext('2d');
  ctx.font = font;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  let x = pad;
  for (const ch of chars) { ctx.fillText(ch, x, c.height / 2); x += ctx.measureText(ch).width + sp; }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { texture: t, aspect: c.width / c.height };
}

/* Dashed placeholder shown until the real image file is added. */
function makeSlotTexture(lines, w = 620, h = 780) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.strokeStyle = 'rgba(150, 200, 172, 0.5)';
  ctx.lineWidth = 5;
  ctx.setLineDash([20, 14]);
  ctx.strokeRect(10, 10, w - 20, h - 20);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => {
    ctx.fillStyle = i === 0 ? 'rgba(214, 236, 224, 0.85)' : 'rgba(150, 200, 172, 0.66)';
    ctx.font = `${i === 0 ? 600 : 400} ${i === 0 ? 74 : 44}px ui-monospace, "Cascadia Code", monospace`;
    ctx.fillText(ln, w / 2, h / 2 + (i - (lines.length - 1) / 2) * 92);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return { texture: t, aspect: w / h };
}

const domeOpacity = CONTENT.backdrop?.opacity ?? 0.5;
const domeMeshes = [];

/* k: 1 = full strength, 0 = fully faded. The dome dims while the car is
   exploded so the floating parts and their labels stay readable. */
function setDomeFade(k) {
  const v = domeOpacity * k;
  for (const m of domeMeshes) m.material.opacity = v;
}

function addDomeItem({ texture, aspect, height, index, y = DOME_Y }) {
  const pivot = new THREE.Group();
  const az = DOME_BASE_AZ + index * Math.PI / 2;
  pivot.position.set(Math.sin(az) * DOME_RADIUS, y, Math.cos(az) * DOME_RADIUS);
  pivot.lookAt(0, 1.2, 0); // faces the car, tilting down into a dome
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(height * aspect, height),
    new THREE.MeshBasicMaterial({
      map: texture, transparent: true, opacity: domeOpacity,
      depthWrite: false, toneMapped: false, fog: false,
    })
  );
  mesh.renderOrder = -2;
  mesh.layers.set(1); // main camera renders layer 1; the floor Reflector does not,
                      // so the dome doesn't cast mirrored text across the floor
  pivot.add(mesh);
  domeGroup.add(pivot);
  domeMeshes.push(mesh);
  return mesh;
}

/* Fade a rectangular photo out at its edges so it melts into the dark dome
   instead of hanging there as a hard-edged rectangle. */
function featherImage(img, amount = 0.16) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  ctx.globalCompositeOperation = 'destination-in';
  const fx = amount, fy = amount;
  let g = ctx.createLinearGradient(0, 0, c.width, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(fx, 'rgba(0,0,0,1)');
  g.addColorStop(1 - fx, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  g = ctx.createLinearGradient(0, 0, 0, c.height);   // applied twice, so the
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(fy, 'rgba(0,0,0,1)');  // alphas multiply
  g.addColorStop(1 - fy, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  return c;
}

/* Swap a placeholder for the real image once it loads, keeping its aspect. */
function loadDomeImage(url, mesh, height, { feather = false } = {}) {
  if (!url) return;
  new THREE.TextureLoader().load(url, (tex) => {   // NB: not the glTF manager,
    const img = tex.image;                         // which stubs out image URLs
    const finalTex = feather ? new THREE.CanvasTexture(featherImage(img)) : tex;
    finalTex.colorSpace = THREE.SRGBColorSpace;
    finalTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    mesh.material.map = finalTex;
    mesh.material.needsUpdate = true;
    mesh.geometry.dispose();
    mesh.geometry = new THREE.PlaneGeometry(height * (img.width / img.height), height);
    layoutDome();
  }, undefined, () => { /* file not there yet — keep the placeholder slot */ });
}

/* Text planes are mostly transparent padding — only the middle ~35% of their
   height is actual glyph — so they carry larger heights than the images. */
const domeTextItems = [];
function addDomeText({ text, opts, height, index, y }) {
  const t = makeTextTexture(text, opts);
  const mesh = addDomeItem({ ...t, height, index, y });
  domeTextItems.push({ mesh, text, opts, height });
  return mesh;
}

{
  const B = CONTENT.backdrop || {};
  // 0 — name (behind the car on load)
  addDomeText({
    text: (B.headline || CONTENT.name).toUpperCase(),
    opts: { size: 210, weight: 700, family: DOME_FONTS.display, track: 0.02 },
    height: 6.2, index: 0,
  });
  // 1 — portrait, edges feathered so it blends into the dome
  const photoH = 5.2;
  const photo = addDomeItem({ ...makeSlotTexture(['PORTRAIT', B.photoUrl || 'me.png']), height: photoH, index: 1, y: 2.85 });
  loadDomeImage(B.photoUrl, photo, photoH, { feather: true });
  // 2 — title, in the signature green
  addDomeText({
    text: (B.subhead || 'Mechatronics Engineer').toUpperCase(),
    opts: { size: 150, weight: 500, family: DOME_FONTS.technical, track: 0.16, color: '#8fdcb0' },
    height: 3.0, index: 2,
  });
  // 3 — school crest (a wide wordmark ends up a wide banner; a square crest stays square)
  const logoH = 5.0;
  const logo = addDomeItem({ ...makeSlotTexture(['CREST', B.logoUrl || 'waterloo.png'], 780, 620), height: logoH, index: 3, y: 2.95 });
  loadDomeImage(B.logoUrl, logo, logoH);
}

/* Canvas bakes whichever face was available at draw time, so re-render the
   text once the webfonts actually arrive. Drawing to a canvas does NOT trigger
   a webfont download on its own — nothing in the DOM uses these faces — so we
   have to request them explicitly before waiting. */
Promise.all([
  document.fonts?.load(`700 210px 'Space Grotesk'`),
  document.fonts?.load(`500 150px 'Space Grotesk'`),
].map((p) => Promise.resolve(p).catch(() => null))).then(() => {
  for (const it of domeTextItems) {
    const t = makeTextTexture(it.text, it.opts);
    it.mesh.material.map?.dispose();
    it.mesh.material.map = t.texture;
    it.mesh.material.needsUpdate = true;
    it.mesh.geometry.dispose();
    it.mesh.geometry = new THREE.PlaneGeometry(it.height * t.aspect, it.height);
  }
  layoutDome();
});

/* Scale the dome so its widest element always fits the viewport. A phone in
   portrait sees a far narrower slice of the dome than a desktop, so this is
   measured rather than guessed at a breakpoint. Re-run whenever an element's
   geometry changes (font swap-in, image load) or the window resizes. */
function layoutDome() {
  const dist = START_DIST + DOME_RADIUS;   // element sitting behind the car
  const visibleW = 2 * dist * Math.tan((camera.fov * Math.PI / 180) / 2) * (innerWidth / innerHeight);
  // Scale each element on its own: the wide text needs shrinking on a phone,
  // but the images are narrow and should stay full size.
  for (const m of domeMeshes) {
    const w = m.geometry.parameters.width;
    m.parent.scale.setScalar(w > 0 ? Math.min(1, (visibleW * 0.86) / w) : 1);
  }
}
layoutDome();

/* =====================================================================
   MATERIAL OVERRIDES
   Fresh materials per (group, source-material) so hover highlights stay
   local to a group. Original textures are skipped entirely (see loader).
   ===================================================================== */
function materialSpec(srcName, meshName) {
  const n = (srcName || '').toLowerCase();
  const m = (meshName || '').toLowerCase();
  if (m.startsWith('brake-caliper')) return { color: ACCENT, roughness: 0.4, metalness: 0.55, env: 0.8 };
  if (m.startsWith('taillight-led')) return { color: 0x2a0508, roughness: 0.3, metalness: 0, emissive: 0x8a1016, emissiveIntensity: 1.4 };
  if (n === 'car-body') return { color: PAINT, roughness: 0.34, metalness: 0.82, clearcoat: 1, clearcoatRoughness: 0.08, env: 1.15 };
  if (n.includes('glass') && n.includes('red')) return { color: 0x3a0708, roughness: 0.2, metalness: 0, transparent: true, opacity: 0.9, emissive: 0x3c060a, emissiveIntensity: 0.5 };
  if (n.includes('glass')) return { color: 0x0c1114, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.55, env: 1.3 };
  if (n === 'mirror') return { color: 0xcfd6d6, roughness: 0.05, metalness: 1, env: 1.2 };
  if (n === 'media') return { color: 0x04110a, roughness: 0.4, metalness: 0, emissive: 0x1a5c3a, emissiveIntensity: 0.9 };
  if (n === 'interior') return { color: 0x1d2023, roughness: 0.85, metalness: 0.1, env: 0.35 };
  if (n === 'mechanics') return { color: 0x26292c, roughness: 0.55, metalness: 0.72, env: 0.55 };
  if (n === 'black-metal') return { color: 0x0e1013, roughness: 0.45, metalness: 0.65, env: 0.6 };
  if (n.includes('rubber') || n === 'wipers' || n.includes('grille')) return { color: 0x0a0c0d, roughness: 0.92, metalness: 0, env: 0.2 };
  if (n.includes('wheel-brake-disc')) return { color: 0x51565b, roughness: 0.32, metalness: 0.92, env: 0.85 };
  if (n.includes('tire')) return { color: 0x0b0d0e, roughness: 0.96, metalness: 0, env: 0.15 };
  return { color: 0x212528, roughness: 0.6, metalness: 0.4, env: 0.5 };
}

const matCache = new Map();
const groupMats = {}; // groupName -> Set of materials (for hover highlight)

function materialFor(groupName, srcName, meshName) {
  const caliper = meshName.toLowerCase().startsWith('brake-caliper');
  const led = meshName.toLowerCase().startsWith('taillight-led');
  const key = `${groupName}|${srcName}|${caliper ? 'cal' : led ? 'led' : ''}`;
  if (matCache.has(key)) return matCache.get(key);
  const s = materialSpec(srcName, meshName);
  const mat = new THREE.MeshPhysicalMaterial({
    color: s.color,
    roughness: s.roughness,
    metalness: s.metalness ?? 0,
    clearcoat: s.clearcoat ?? 0,
    clearcoatRoughness: s.clearcoatRoughness ?? 0,
    transparent: !!s.transparent,
    opacity: s.opacity ?? 1,
    envMapIntensity: s.env ?? 0.7,
  });
  if (s.emissive) mat.emissive.setHex(s.emissive);
  mat.emissiveIntensity = s.emissiveIntensity ?? 1;
  mat.userData.baseEmissive = mat.emissive.getHex();
  mat.userData.baseEmissiveIntensity = mat.emissiveIntensity;
  matCache.set(key, mat);
  (groupMats[groupName] ??= new Set()).add(mat);
  return mat;
}

/* =====================================================================
   CAR ASSEMBLY — load model, split into explode groups
   ===================================================================== */
const carRoot = new THREE.Group();
scene.add(carRoot);
const groups = {};
for (const name of Object.keys(EXPLODE)) {
  const g = new THREE.Group();
  g.name = 'grp-' + name;
  g.userData.groupName = name;
  groups[name] = g;
  carRoot.add(g);
}
/* group -> section id */
const groupSection = {};
for (const [sid, s] of Object.entries(SECTIONS)) for (const g of s.groups) groupSection[g] = sid;

function classify(meshName) {
  const n = meshName.toLowerCase();
  for (const [group, re] of CLASSIFY) if (re.test(n)) return group;
  return 'body';
}

/* Skip the model's large texture files — all materials get replaced anyway. */
const TINY_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => /\.(png|jpe?g|webp)(\?.*)?$/i.test(url) ? TINY_PNG : url);

const loaderEl = document.getElementById('loader');
const loaderPct = document.getElementById('loader-pct');

const gltfLoader = new GLTFLoader(manager);
gltfLoader.setMeshoptDecoder(MeshoptDecoder);

function loadModel(url, onFail) {
  gltfLoader.load(
    url,
    (gltf) => { assembleFromGLTF(gltf); finishSetup(); },
    (e) => { if (e.total) loaderPct.textContent = Math.min(99, Math.round(e.loaded / e.total * 100)); },
    onFail
  );
}
loadModel(MODEL_URL, (err) => {
  console.warn('Compressed model failed to load — trying original source.', err);
  loadModel(FALLBACK_MODEL_URL, (err2) => {
    console.warn('Model failed to load — using primitive fallback car.', err2);
    buildFallbackCar();
    finishSetup();
  });
});

function assembleFromGLTF(gltf) {
  const src = gltf.scene;
  src.updateMatrixWorld(true);
  const meshes = [];
  src.traverse((o) => { if (o.isMesh) meshes.push(o); });
  scene.add(src); // temporarily, so attach() sees valid world matrices
  for (const mesh of meshes) {
    const groupName = classify(mesh.name);
    mesh.material = materialFor(groupName, mesh.material?.name || '', mesh.name);
    mesh.castShadow = true;
    groups[groupName].attach(mesh);
  }
  scene.remove(src);
}

/* Primitive stand-in with the same group structure (used only on load failure). */
function buildFallbackCar() {
  const M = (geo, spec, group, x = 0, y = 0, z = 0) => {
    const mesh = new THREE.Mesh(geo, materialFor(group, spec, spec));
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    groups[group].add(mesh);
    return mesh;
  };
  // body shell
  M(new RoundedBoxGeometry(1.9, 0.55, 4.3, 3, 0.12), 'car-body', 'body', 0, 0.72, 0);
  const cabin = M(new RoundedBoxGeometry(1.62, 0.5, 1.9, 3, 0.18), 'Glass_ext', 'body', 0, 1.16, -0.35);
  cabin.material = materialFor('body', 'Glass_ext', 'cabin-glass');
  M(new RoundedBoxGeometry(1.7, 0.16, 1.1, 2, 0.06), 'car-body', 'body', 0, 1.0, 1.35); // hood hint
  // chassis
  M(new THREE.BoxGeometry(1.7, 0.14, 4.0), 'mechanics', 'chassis', 0, 0.34, 0);
  M(new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12).rotateX(Math.PI / 2), 'mechanics', 'chassis', 0.45, 0.32, -2.05);
  M(new THREE.CylinderGeometry(0.07, 0.07, 0.5, 12).rotateX(Math.PI / 2), 'mechanics', 'chassis', -0.45, 0.32, -2.05);
  // engine
  M(new THREE.BoxGeometry(1.1, 0.55, 0.9), 'mechanics', 'engine', 0, 0.75, 1.3);
  M(new THREE.BoxGeometry(1.3, 0.12, 0.5), 'mechanics', 'engine', 0, 1.06, 1.3);
  // wheels
  for (const [x, z] of [[0.95, 1.42], [-0.95, 1.42], [0.95, -1.42], [-0.95, -1.42]]) {
    const w = M(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 24).rotateZ(Math.PI / 2), 'tire-low.001', 'wheels', x, 0.42, z);
    w.name = 'tire-low-fallback';
    const hub = M(new THREE.CylinderGeometry(0.22, 0.22, 0.32, 16).rotateZ(Math.PI / 2), 'wheel-brake-disc', 'wheels', x, 0.42, z);
    hub.name = 'wheel-full-fallback';
  }
  // cockpit
  M(new RoundedBoxGeometry(0.55, 0.6, 0.6, 2, 0.08), 'interior', 'cockpit', 0.42, 0.85, -0.5);
  M(new RoundedBoxGeometry(0.55, 0.6, 0.6, 2, 0.08), 'interior', 'cockpit', -0.42, 0.85, -0.5);
  // dashboard
  M(new RoundedBoxGeometry(1.5, 0.28, 0.45, 2, 0.06), 'interior', 'dashboard', 0, 0.98, 0.45);
  M(new THREE.TorusGeometry(0.19, 0.03, 10, 24), 'interior', 'dashboard', 0.42, 1.0, 0.2);

/* Procedural key fob (Contact) — meshes centered on group origin, scale pops in. */

/* =====================================================================
   POST-LOAD SETUP: orient, normalize, anchors, guide lines, labels
   ===================================================================== */
const guideLines = [];
const guideLineFor = {}; // groupName -> its line, so each one can trail its part
const labelAnchors = {}; // sectionId -> Object3D
let carCenterY = 1;

function finishSetup() {
  // --- orient: longest horizontal axis becomes Z, engine toward +Z
  let bb = new THREE.Box3().setFromObject(carRoot);
  let size = bb.getSize(new THREE.Vector3());
  if (size.x > size.z) carRoot.rotation.y = Math.PI / 2;
  carRoot.updateMatrixWorld(true);
  if (groups.engine.children.length) {
    const ec = new THREE.Box3().setFromObject(groups.engine).getCenter(new THREE.Vector3());
    const cc = new THREE.Box3().setFromObject(carRoot).getCenter(new THREE.Vector3());
    if (ec.z < cc.z) carRoot.rotation.y += Math.PI;
    carRoot.updateMatrixWorld(true);
  }

  // --- normalize: length 4.3, centered, wheels on the floor
  bb = new THREE.Box3().setFromObject(carRoot);
  size = bb.getSize(new THREE.Vector3());
  const scale = 4.3 / Math.max(size.x, size.z);
  carRoot.scale.setScalar(scale);
  carRoot.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(carRoot);
  const center = bb.getCenter(new THREE.Vector3());
  carRoot.position.x -= center.x;
  carRoot.position.z -= center.z;
  carRoot.position.y -= bb.min.y;
  carRoot.userData.baseY = carRoot.position.y;
  carRoot.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(carRoot);
  carCenterY = (bb.max.y - bb.min.y) / 2 / scale; // in carRoot local units

  buildKeyFob();

  // --- per-wheel lateral spread & per-mesh base positions
  for (const mesh of groups.wheels.children) {
    mesh.userData.basePos = mesh.position.clone();
    if (/^damper/i.test(mesh.name)) { mesh.userData.spread = new THREE.Vector3(); continue; }
    const c = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
    carRoot.worldToLocal(c);
    mesh.userData.spread = new THREE.Vector3(Math.sign(c.x || 1) * WHEEL_SPREAD, 0, 0);
  }

  // --- anchors (group centroid, in carRoot space) + guide lines + labels
  const lineMatProto = new THREE.LineDashedMaterial({
    color: 0xa7bcae, dashSize: 0.09, gapSize: 0.07, transparent: true, opacity: 0,
  });
  const origin = new THREE.Vector3(0, carCenterY, 0);

  for (const [name, group] of Object.entries(groups)) {
    let centroid;
    if (name === 'keyfob') {
      centroid = new THREE.Vector3(); // fob meshes are centered on group origin
    } else {
      centroid = new THREE.Box3().setFromObject(group).getCenter(new THREE.Vector3());
      carRoot.worldToLocal(centroid);
    }
    const h = name === 'keyfob' ? 0.3 : new THREE.Box3().setFromObject(group).getSize(new THREE.Vector3()).y / carRoot.scale.x / 2;
    group.userData.centroid = centroid;
    group.userData.offset = EXPLODE[name];

    // anchor for the floating label (top of part), tracks the group
    const anchor = new THREE.Object3D();
    anchor.position.copy(centroid).add(new THREE.Vector3(0, Math.min(h + 0.18, 1.1), 0));
    if (name === 'keyfob') anchor.position.set(0, 0.35, 0);
    group.add(anchor);
    const sid = groupSection[name];
    if (SECTIONS[sid].labelGroup ? SECTIONS[sid].labelGroup === name : true) labelAnchors[sid] = anchor;

    // dashed guide line: assembly center -> exploded resting point
    // Starts collapsed on the assembled centroid; setGroupProgress() walks the
    // tip outward so the line is drawn *by* the part as it flies out.
    const lineGeo = new THREE.BufferGeometry().setFromPoints([origin, centroid.clone()]);
    const line = new THREE.Line(lineGeo, lineMatProto.clone());
    line.computeLineDistances();
    line.visible = false;
    line.userData.centroid = centroid.clone();
    line.userData.offset = EXPLODE[name];
    carRoot.add(line);
    guideLines.push(line);
    guideLineFor[name] = line;
  }

  buildLabels();
  document.getElementById('loader').classList.add('done');
  stage.classList.add('ready');
  introFly();
  // deep link: /#projects etc. jumps straight to that section
  const initial = location.hash.slice(1);
  if (SECTION_ORDER.includes(initial)) {
    setTimeout(() => withExploded(() => openPanel(initial, true)), prefersReduced ? 250 : 900);
  } else {
    setTimeout(() => { if (state === 'assembled') showHint(); }, prefersReduced ? 200 : 1400);
  }
}

/* cinematic ease-in to the start framing */
function introFly() {
  const from = camera.position.clone();
  const dir = new THREE.Vector3(5.2, 2.35, 7.4).normalize();
  const to = dir.multiplyScalar(START_DIST).add(new THREE.Vector3(0, 0.6, 0));
  if (prefersReduced) { camera.position.copy(to); return; }
  addTween({
    dur: 1.9, ease: easeOutCubic,
    update: (k) => camera.position.lerpVectors(from, to, k),
  });
}

/* =====================================================================
   HTML LABELS (real buttons -> keyboard navigable)
   ===================================================================== */
const labelsWrap = document.getElementById('labels');
const labelEls = {};
function buildLabels() {
  for (const sid of SECTION_ORDER) {
    const s = SECTIONS[sid];
    const b = document.createElement('button');
    b.className = 'part-label';
    b.hidden = true;
    b.setAttribute('aria-label', `${s.title} — ${s.part} section`);
    b.innerHTML = `<span class="pl-part">${s.part}</span><span class="pl-section">${s.title}</span>`;
    b.addEventListener('click', () => openPanel(sid));
    b.addEventListener('mouseenter', () => setHover(sid));
    b.addEventListener('mouseleave', () => setHover(null));
    b.addEventListener('focus', () => setHover(sid));
    b.addEventListener('blur', () => setHover(null));
    labelsWrap.appendChild(b);
    labelEls[sid] = b;
  }
}

const _v = new THREE.Vector3();
function updateLabels() {
  const show = state === 'exploded';
  for (const sid of SECTION_ORDER) {
    const el = labelEls[sid];
    const anchor = labelAnchors[sid];
    if (!el || !anchor) continue;
    if (!show) { el.hidden = true; el.classList.remove('show'); continue; }
    anchor.getWorldPosition(_v).project(camera);
    if (_v.z > 1) { el.hidden = true; continue; }
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add('show'));
    el.style.transform =
      `translate(-50%, -130%) translate(${(_v.x * 0.5 + 0.5) * innerWidth}px, ${(-_v.y * 0.5 + 0.5) * innerHeight}px)`;
  }
}

/* =====================================================================
   TWEENS
   ===================================================================== */
const tweens = [];
const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
function addTween({ dur = 1, delay = 0, ease = easeInOutCubic, update, done }) {
  const tw = { t: -delay, dur: prefersReduced ? Math.min(dur, 0.25) : dur, ease, update, done };
  tweens.push(tw);
  return tw;
}
function killTween(tw) {
  const i = tweens.indexOf(tw);
  if (i >= 0) tweens.splice(i, 1);
}
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    if (tw.t < 0) continue;
    const k = Math.min(tw.t / tw.dur, 1);
    tw.update(tw.ease(k));
    if (k >= 1) { tweens.splice(i, 1); tw.done?.(); }
  }
}

/* =====================================================================
   EXPLODE / ASSEMBLE
   ===================================================================== */
let state = 'assembled'; // assembled | exploding | exploded | assembling
const announcer = document.getElementById('announcer');
const btnAssemble = document.getElementById('btn-assemble');
const hintEl = document.getElementById('hint');
const hintParts = document.getElementById('hint-parts');
let hintPartsShown = false;
document.getElementById('hint-text').textContent = isTouch ? 'Tap anywhere to begin' : 'Click anywhere to begin';
document.getElementById('hint-parts-text').textContent = isTouch ? 'Tap a component' : 'Select a component';

function showHint() { hintEl.classList.add('show'); }

/* ---- camera focus: glide the orbit target toward a section's part ---- */
const EXPLODED_TARGET = new THREE.Vector3(0, 1.55, 0);
let targetTween = null;
function tweenCamTarget(t1, dur = 0.9) {
  killTween(targetTween);
  const t0 = controls.target.clone();
  targetTween = addTween({ dur, ease: easeInOutCubic, update: (k) => controls.target.lerpVectors(t0, t1, k) });
}
function focusCameraOn(sid) {
  if (state !== 'exploded' && state !== 'exploding') return;
  const anchor = labelAnchors[sid];
  if (!anchor) return;
  const p = anchor.getWorldPosition(new THREE.Vector3());
  tweenCamTarget(EXPLODED_TARGET.clone().lerp(p, 0.55));
}
function unfocusCamera() {
  if (state !== 'exploded') return;
  tweenCamTarget(EXPLODED_TARGET.clone());
}

/* run fn once the assembly is exploded (exploding it first if needed) */
function withExploded(fn) {
  if (state === 'exploded') fn();
  else if (state === 'assembled') { explode(); setTimeout(fn, prefersReduced ? 400 : 1600); }
  else setTimeout(() => withExploded(fn), 400);
}

function setGroupProgress(name, e) {
  const g = groups[name];
  g.position.copy(g.userData.offset).multiplyScalar(e);
  if (name === 'wheels') {
    for (const mesh of g.children) {
      if (!mesh.userData.basePos) continue;
      mesh.position.copy(mesh.userData.basePos).addScaledVector(mesh.userData.spread, e);
    }
  }
  if (name === 'keyfob') {
    g.visible = e > 0.01;
    g.scale.setScalar(Math.max(0.001, e));
  }
  // The guide line's tip rides along with the part, so the line unspools from
  // the assembly centre and trails behind instead of appearing full-length.
  // Opacity is tied to the same progress, so each line fades in with its part
  // rather than the whole set flashing on at once.
  const line = guideLineFor[name];
  if (line) {
    const { centroid, offset } = line.userData;
    const pos = line.geometry.attributes.position;
    pos.setXYZ(1, centroid.x + offset.x * e, centroid.y + offset.y * e, centroid.z + offset.z * e);
    pos.needsUpdate = true;
    line.computeLineDistances();
    line.material.opacity = 0.5 * Math.min(1, e * 2.2);
  }
}

function explode() {
  if (state !== 'assembled') return;
  state = 'exploding';
  hintEl.classList.add('gone');
  killTween(targetTween); targetTween = null;
  controls.autoRotate = false;
  const names = Object.keys(groups);
  names.forEach((name, i) => {
    addTween({
      dur: 1.25, delay: i * 0.07, ease: easeInOutCubic,
      update: (e) => setGroupProgress(name, e),
    });
  });
  addTween({
    dur: 1.25, delay: 0.05,
    update: (e) => { carRoot.position.y = carRoot.userData.baseY + ROOT_RAISE * e; },
  });
  // backdrop dome recedes so it doesn't cut across the floating parts
  addTween({ dur: 0.9, delay: 0.1, ease: easeInOutCubic, update: (e) => setDomeFade(1 - 0.88 * e) });
  // lines are live from frame one — setGroupProgress() draws and fades each one
  // in step with its own part, including that part's stagger delay
  guideLines.forEach((l) => { l.visible = true; l.material.opacity = 0; });
  // camera pulls up + back
  const t0 = controls.target.clone();
  const t1 = new THREE.Vector3(0, 1.55, 0);
  const p0 = camera.position.clone();
  const p1 = p0.clone().sub(t0).multiplyScalar(1.42).add(t1);
  addTween({
    dur: 1.15, delay: 0.1, ease: easeInOutCubic,
    update: (k) => {
      controls.target.lerpVectors(t0, t1, k);
      camera.position.lerpVectors(p0, p1, k);
    },
    done: () => {
      state = 'exploded';
      btnAssemble.hidden = false;
      controls.autoRotate = !prefersReduced;
      controls.autoRotateSpeed = 0.3;
      announcer.textContent = 'Assembly exploded. Six sections available — use Tab to move between parts, Enter to open.';
      if (!panelOpen && !hintPartsShown) {
        hintPartsShown = true;
        hintParts.classList.add('show');
        setTimeout(() => hintParts.classList.add('gone'), 6000);
      }
    },
  });
}

function assemble() {
  if (state !== 'exploded') return;
  state = 'assembling';
  btnAssemble.hidden = true;
  killTween(targetTween); targetTween = null;
  hintParts.classList.add('gone');
  setHover(null);
  updateLabels();
  // lines retract and fade with their parts (setGroupProgress runs in reverse),
  // then switch off once everything is home
  addTween({ dur: 1.35, update: () => {}, done: () => guideLines.forEach((l) => { l.visible = false; }) });
  addTween({ dur: 0.9, delay: 0.2, ease: easeInOutCubic, update: (e) => setDomeFade(0.12 + 0.88 * e) });
  const names = Object.keys(groups);
  names.forEach((name, i) => {
    addTween({
      dur: 1.0, delay: i * 0.04, ease: easeInOutCubic,
      update: (e) => setGroupProgress(name, 1 - e),
    });
  });
  addTween({ dur: 1.0, update: (e) => { carRoot.position.y = carRoot.userData.baseY + ROOT_RAISE * (1 - e); } });
  const t0 = controls.target.clone();
  const t1 = new THREE.Vector3(0, 0.85, 0);
  const p0 = camera.position.clone();
  const p1 = p0.clone().sub(t0).multiplyScalar(1 / 1.42).add(t1);
  addTween({
    dur: 1.0, delay: 0.05, ease: easeInOutCubic,
    update: (k) => { controls.target.lerpVectors(t0, t1, k); camera.position.lerpVectors(p0, p1, k); },
    done: () => {
      state = 'assembled';
      controls.autoRotate = !prefersReduced;
      controls.autoRotateSpeed = 0.55;
      announcer.textContent = 'Assembly reassembled. Click the car to explode it again.';
    },
  });
}
btnAssemble.addEventListener('click', assemble);

/* =====================================================================
   HOVER + CLICK PICKING
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let pointerDirty = false;
let hoveredSection = null;

function setHover(sid) {
  if (hoveredSection === sid) return;
  // restore old
  if (hoveredSection) {
    for (const g of SECTIONS[hoveredSection].groups) {
      groupMats[g]?.forEach((m) => {
        m.emissive.setHex(m.userData.baseEmissive);
        m.emissiveIntensity = m.userData.baseEmissiveIntensity;
      });
      groups[g].userData.liftTarget = 0;
    }
    labelEls[hoveredSection]?.classList.remove('hot');
  }
  hoveredSection = sid;
  if (sid) {
    for (const g of SECTIONS[sid].groups) {
      groupMats[g]?.forEach((m) => {
        m.emissive.setHex(0x123c26);
        m.emissiveIntensity = Math.max(1, m.userData.baseEmissiveIntensity);
      });
      groups[g].userData.liftTarget = 1;
    }
    labelEls[sid]?.classList.add('hot');
  }
  renderer.domElement.style.cursor = sid ? 'pointer' : (state === 'assembled' ? 'pointer' : 'grab');
}

function pickSection() {
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(Object.values(groups), true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.groupName) o = o.parent;
    if (o) return groupSection[o.userData.groupName] || null;
  }
  return null;
}

renderer.domElement.addEventListener('pointermove', (e) => {
  pointerNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pointerDirty = true;
});

/* click = pointerdown + pointerup with little movement (drags stay free) */
let downPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 7 || panelOpen) return;
  if (state === 'assembled') { explode(); return; }
  if (state === 'exploded') {
    pointerNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    const sid = pickSection();
    if (sid) openPanel(sid);
  }
});

function hexToRgbTriple(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

function skillIconSvg(key) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.7');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = SKILL_ICON_PATHS[key] || SKILL_ICON_PATHS.gear;
  return svg;
}

function iconSvg(spec) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  if (spec.stroke) {
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
  } else {
    svg.setAttribute('fill', 'currentColor');
  }
  for (const d of spec.d.split('|')) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  }
  return svg;
}
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

const builders = {
  about() {
    const w = el('div');
    w.appendChild(el('p', 'p-text', CONTENT.aboutMe));
    return w;
  },
  experience() {
    const w = el('div', 'timeline');

        badge.appendChild(img);
        e.appendChild(badge);
      }
      const body = el('div', 'entry-body');
      body.appendChild(el('h3', null, x.title));
      body.appendChild(el('div', 'meta', `${x.org} — ${x.dates}`));

        const ul = el('ul', 'entry-bullets');
        for (const b of bullets) ul.appendChild(el('li', null, b));
        body.appendChild(ul);
      } else if (!isPlaceholder(x.description)) {

      head.appendChild(el('span', 'proj-date', p.date));
      body.appendChild(head);
      body.appendChild(el('p', 'proj-desc', p.description));

      // nothing at all when the project has no repo ("none")

        const live = !isPlaceholder(p.link);

        if (live) {
          link.href = p.link; link.target = '_blank'; link.rel = 'noopener';

let panelPushed = false; // true when the open panel added a history entry

function openPanel(sid, fromPop = false) {
  const s = SECTIONS[sid];
  if (!s || panelOpen) return;
  panelOpen = true;
  lastFocused = document.activeElement;
  panel.className = `size-${s.size}`;
  panelEyebrow.textContent = `Assembly ref ${s.num} · ${s.part}`;
  panelTitleEl.textContent = s.title;
  panelWm.textContent = s.num;
  panelTitleblock.replaceChildren(
    el('span', null, `Sheet ${s.num} / ${SECTION_TOTAL}`),
    el('span', null, 'Rev A'),
    el('span', null, 'Scale 1:1'),
    (() => { const live = el('span', 'tb-live'); live.append(el('span', 'tb-dot'), document.createTextNode('Live')); return live; })(),
  );
  panelBody.replaceChildren(builders[sid]());
  panelBody.scrollTop = 0;
  // stagger content entrance
  panelBody.querySelectorAll('.entry, .proj-card, .skill-group, .spec-row, .p-text, .edu-plate')
    .forEach((it, i) => { it.classList.add('anim-item'); it.style.setProperty('--i', i); });
  backdrop.classList.add('open');
  panel.classList.add('open');
  labelsWrap.inert = true;
  setHover(null);
  hintParts.classList.add('gone');
  focusCameraOn(sid);
  if (!fromPop) { history.pushState({ panel: sid }, '', '#' + sid); panelPushed = true; }
  panelClose.focus();
  announcer.textContent = `${s.title} panel opened.`;
}

function closePanel(fromPop = false) {
  if (!panelOpen) return;
  if (!fromPop && panelPushed) { history.back(); return; } // popstate finishes the close
  panelPushed = false;
  panelOpen = false;
  backdrop.classList.remove('open');
  panel.classList.remove('open');
  labelsWrap.inert = false;
  unfocusCamera();
  if (!fromPop && location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (lastFocused?.isConnected && lastFocused.focus) lastFocused.focus();
  announcer.textContent = 'Panel closed.';
}
panelClose.addEventListener('click', () => closePanel());
backdrop.addEventListener('click', () => closePanel());

/* deep links: #experience … #contact map to panels; back/forward work */
addEventListener('popstate', () => {
  const sid = location.hash.slice(1);
  if (SECTION_ORDER.includes(sid)) {
    if (panelOpen) closePanel(true);
    withExploded(() => openPanel(sid, true));
  } else if (panelOpen) {
    closePanel(true);
  }
});

/* keep keyboard focus inside the dialog while it is open */
panel.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const focusables = panel.querySelectorAll('button, a[href]');
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
});

/* =====================================================================
   GLOBAL KEYBOARD
   ===================================================================== */
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (panelOpen) { closePanel(); return; }
    if (state === 'exploded') assemble();
    return;
  }
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName);
  if (typing) return;
  if ((e.key === 'Enter' || e.key === ' ') && state === 'assembled' && e.target === document.body) {
    e.preventDefault();
    explode();
    return;
  }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6 && !panelOpen) withExploded(() => openPanel(SECTION_ORDER[n - 1]));
});

/* =====================================================================
   HEADER / LINKS / STATIC CONTENT
   ===================================================================== */
document.title = isPlaceholder(CONTENT.name) ? 'Jude Rosario' : CONTENT.name;
for (const [id, url] of [
  ['lnk-linkedin', CONTENT.contact.linkedin],
  ['lnk-github', CONTENT.contact.github],
  ['lnk-resume', CONTENT.contact.resumeLink],
]) {
  const a = document.getElementById(id);
  // hide rather than leave a dead '#' link until the URL is filled in
  if (isPlaceholder(url)) a.hidden = true;
  else { a.href = url; a.hidden = false; }
}
document.querySelector('meta[property="og:title"]').setAttribute('content', document.title);

/* Hidden semantic mirror of CONTENT for screen readers and search engines.
   Reuses the panel builders, so it always matches what the panels show. */
{
  const mirror = el('main', 'sr-only');
  mirror.appendChild(el('h1', null, CONTENT.name));
  mirror.appendChild(el('p', null, CONTENT.tagline));
  for (const sid of SECTION_ORDER) {
    const sec = document.createElement('section');
    sec.appendChild(el('h2', null, SECTIONS[sid].title));
    sec.appendChild(builders[sid]());
    mirror.appendChild(sec);
  }
  document.body.appendChild(mirror);
}

/* =====================================================================
   RENDER LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let elapsed = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  stepTweens(dt);
  controls.update();

  // idle light pulse
  if (!prefersReduced) {
    keyLight.intensity = 320 * (1 + 0.07 * Math.sin(elapsed * 0.8));
    glow.material.opacity = 0.85 + 0.12 * Math.sin(elapsed * 0.6 + 1);
  }

  // hover raycast (only while exploded and pointer moved)
  if (pointerDirty && state === 'exploded' && !panelOpen) {
    pointerDirty = false;
    setHover(pickSection());
  }

  // hover lift
  if (state === 'exploded') {
    for (const g of Object.values(groups)) {
      const target = g.userData.liftTarget || 0;
      g.userData.lift = THREE.MathUtils.lerp(g.userData.lift || 0, target, 1 - Math.pow(0.001, dt));
      g.position.y = g.userData.offset.y + 0.07 * g.userData.lift;
    }
  }

  updateLabels();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  layoutDome();
});

/* Dev hook (harmless in production): lets tooling drive frames & capture. */
window.__dbg = {
  groups, explode, assemble, openPanel, closePanel, camera, controls, THREE,
  domeMeshes, setDomeFade,
  pick(x, y) { pointerNdc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); return pickSection(); },
  get state() { return state; },
  frame(dt = 1 / 60) {
    stepTweens(dt);
    controls.update();
    updateLabels();
    renderer.render(scene, camera);
  },
  shot(w = 720) {
    this.frame(0.001);
    const src = renderer.domElement;
    const c = document.createElement('canvas');
    c.width = w; c.height = Math.round(w * src.height / src.width);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  },
};
